name: Package validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: bun run test:package
      - name: Publish PR package preview
        if: github.event_name == 'pull_request'
        run: bunx pkg-pr-new@0.0.37 publish --comment=off
