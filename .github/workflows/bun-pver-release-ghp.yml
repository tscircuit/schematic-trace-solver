name: Publish to GitHub Packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  pull-requests: write
concurrency:
  group: publish-github-packages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: bump version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pver
      - run: bun install
      - run: bun run test:package
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@tscircuit'
      - name: Publish bundled package for jscdn
        run: pver release --no-push-main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Read released version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v6
        id: version-pr
        with:
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          commit-message: 'chore: bump version'
          title: 'chore: bump version to v${{ steps.version.outputs.version }}'
          body: 'Record the version published to GitHub Packages for jscdn.'
          branch: version-bumps/v${{ steps.version.outputs.version }}
          base: main
          committer: tscircuitbot <githubbot@tscircuit.com>
          author: tscircuitbot <githubbot@tscircuit.com>
      - name: Enable version PR auto-merge
        if: steps.version-pr.outputs.pull-request-number != ''
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.version-pr.outputs.pull-request-number }}
