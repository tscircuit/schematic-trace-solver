<svg width="1200" height="2016" viewBox="0 0 1200 2016" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solver debug visualization on top and Circuit JSON schematic on the bottom">
  <g transform="translate(0, 0) scale(1.875, 1.875) translate(0, 0)">
    <rect width="100%" height="100%" fill="white"/><g><polyline data-points="-1.4,0.1 -1.69,0.1 -1.69,0.099" data-type="line" data-label="" points="141.29692832764505,300.8873720136519 85.87030716723547,300.8873720136519 85.87030716723547,301.07849829351534" fill="none" stroke="purple" stroke-width="1px"/></g><g><rect data-type="rect" data-label="U1" data-x="0" data-y="0" x="217.74744027303757" y="224.43686006825936" width="382.25255972696243" height="191.12627986348127" fill="hsl(164, 100%, 50%, 0.8)" stroke="black" stroke-width="0.005232142857142857"/></g><g><rect data-type="rect" data-label="netId: GND
globalConnNetId: connectivity_net0" data-x="-1.69" data-y="-0.11099999999999999" x="39.99999999999997" y="301.07849829351534" width="91.74061433447099" height="80.27303754266211" fill="#00000066" stroke="#000000" stroke-width="0.005232142857142857"/></g><g><circle data-type="point" data-label="GND
x-" data-x="-1.4" data-y="0.1" cx="141.29692832764505" cy="300.8873720136519" r="3" fill="hsl(157, 100%, 50%, 0.8)"/></g><g><circle data-type="point" data-label="VCC
x-" data-x="-1.4" data-y="-0.1" cx="141.29692832764505" cy="339.1126279863481" r="3" fill="hsl(190, 100%, 50%, 0.8)"/></g><g><circle data-type="point" data-label="anchorPoint
orientation: y-" data-x="-1.69" data-y="0.099" cx="85.87030716723547" cy="301.07849829351534" r="3" fill="hsl(40, 100%, 50%, 0.9)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":191.12627986348124,"c":0,"e":408.8737201365188,"b":0,"d":-191.12627986348124,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script>
  </g>
