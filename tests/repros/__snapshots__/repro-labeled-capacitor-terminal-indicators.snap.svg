<svg width="1200" height="2016" viewBox="0 0 1200 2016" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solver debug visualization on top and Circuit JSON schematic on the bottom">
  <g transform="translate(0, 0) scale(1.875, 1.875) translate(0, 0)">
    <rect width="100%" height="100%" fill="white"/><g><rect data-type="rect" data-label="C1" data-x="0" data-y="0" x="250.08739076154802" y="187.16604244694133" width="139.82521847690393" height="265.66791510611733" fill="hsl(326, 100%, 50%, 0.8)" stroke="black" stroke-width="0.0028607142857142854"/></g><g><rect data-type="rect" data-label="netId: VCC
globalConnNetId: connectivity_net0" data-x="0" data-y="0.591" x="285.043695380774" y="39.999999999999986" width="69.91260923845198" height="146.81647940074905" fill="#ef444466" stroke="#ef4444" stroke-width="0.0028607142857142854"/></g><g><rect data-type="rect" data-label="netId: GND
globalConnNetId: connectivity_net1" data-x="0" data-y="-0.591" x="285.043695380774" y="453.18352059925104" width="69.91260923845198" height="146.81647940074902" fill="#00000066" stroke="#000000" stroke-width="0.0028607142857142854"/></g><g><circle data-type="point" data-label="C1.1
y+" data-x="0" data-y="0.38" cx="320" cy="187.1660424469413" r="3" fill="hsl(121, 100%, 50%, 0.8)"/></g><g><circle data-type="point" data-label="C1.2
y-" data-x="0" data-y="-0.38" cx="320" cy="452.83395755305867" r="3" fill="hsl(122, 100%, 50%, 0.8)"/></g><g><circle data-type="point" data-label="anchorPoint
orientation: y+" data-x="0" data-y="0.38" cx="320" cy="187.1660424469413" r="3" fill="hsl(40, 100%, 50%, 0.9)"/></g><g><circle data-type="point" data-label="anchorPoint
orientation: y-" data-x="0" data-y="-0.38" cx="320" cy="452.83395755305867" r="3" fill="hsl(40, 100%, 50%, 0.9)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":349.5630461922597,"c":0,"e":320,"b":0,"d":-349.5630461922597,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script>
  </g>
