><line class="component-pin sch-component-pin sch-port-line" x1="750" y1="662.5" x2="750" y2="650" stroke-width="2.5px"/><g class="sch-port" data-schematic-port-id="source_port_0_0__stack1"><rect x="747.5" y="647.5" width="5" height="5" opacity="0"/></g><text class="pin-number sch-pin-number" x="747.5" y="656.25" style="font-family: sans-serif;" fill="rgb(169, 0, 0)" text-anchor="middle" dominant-baseline="auto" font-size="18.75px" transform="rotate(-90 747.5 656.25)">1</text></g><g class="sch-component" data-circuit-json-type="schematic_component" data-schematic-component-id="schematic_component_1__stack1"><rect class="component chip sch-component-body" x="712.5" y="62.5" width="75" height="74.99999999999989" stroke-width="2.5px" fill="rgb(255, 255, 194)" stroke="rgb(132, 0, 0)"/><rect class="component-overlay sch-component-overlay" x="712.5" y="62.5" width="75" height="74.99999999999989" fill="transparent"/><text class="sch-text" x="750" y="100" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="22.5px" transform="rotate(0, 750, 100)">U2</text><line class="component-pin sch-component-pin sch-port-line" x1="750" y1="137.4999999999999" x2="750" y2="150" stroke-width="2.5px"/><g class="sch-port" data-schematic-port-id="source_port_1_0__stack1"><rect x="747.5" y="147.5" width="5" height="5" opacity="0"/></g><text class="pin-number sch-pin-number" x="747.5" y="143.75" style="font-family: sans-serif;" fill="rgb(169, 0, 0)" text-anchor="middle" dominant-baseline="auto" font-size="18.75px" transform="rotate(-90 747.5 143.75)">1</text></g><g class="sch-component" data-circuit-json-type="schematic_component" data-schematic-component-id="schematic_component_2__stack1"><rect class="component chip sch-component-body" x="412.50000000000006" y="362.5" width="74.99999999999994" height="75" stroke-width="2.5px" fill="rgb(255, 255, 194)" stroke="rgb(132, 0, 0)"/><rect class="component-overlay sch-component-overlay" x="412.500000000000