817895401" fill="none" stroke="#15803d" stroke-width="1px"/></g><g><polyline data-points="0.8099999999999998,-1.325 0.8099999999999998,-0.7000000000000002 1.2489999999999997,-0.7000000000000002 1.2489999999999997,-0.07500000000000018 1.1,-0.07500000000000018" data-type="line" data-label="schematic_port_6-schematic_port_29" points="399.57151858853183,600 399.57151858853183,555.8916194076875 430.5532451165721,555.8916194076875 430.5532451165721,511.78323881537494 420.03780718336486,511.78323881537494" fill="none" stroke="#15803d" stroke-width="1px"/></g><g><rect data-type="rect" data-label="schematic_component_5" data-x="-0.09999999999999964" data-y="3.825" x="264.77630749842467" y="215.37492123503463" width="141.14681789540015" height="42.344045368620016" fill="#fff7ed" stroke="black" stroke-width="0.014169642857142858"/></g><g><rect data-type="rect" data-label="schematic_component_9" data-x="0" data-y="0.625" x="264.77630749842467" y="398.8657844990548" width="155.2614996849402" height="127.0321361058601" fill="#fff7ed" stroke="black" stroke-width="0.014169642857142858"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":70.57340894770006,"c":0,"e":342.40705734089477,"b":0,"d":-70.57340894770006,"f":506.4902331442974};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>