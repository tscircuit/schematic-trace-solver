<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-1.0999999999999996,3.625 -1.8124999999999996,3.625 -1.8124999999999996,4.010000000000001 -2.7249999999999996,4.010000000000001 -2.7249999999999996,3.8100000000000005" data-type="line" data-label="schematic_port_12-schematic_port_0" points="378.4006595218467,228.128606760099 312.61335531739496,228.128606760099 312.61335531739496,192.58037922506185 228.35943940643037,192.58037922506185 228.35943940643037,211.0469909315746" fill="none" stroke="#15803d" stroke-width="1px"/></g><g><polyline data-points="-1.0999999999999996,4.025 -1.1999999999999995,4.025 -1.1999999999999995,3.625 -1.0999999999999996,3.625" data-type="line" data-label="schematic_port_10-schematic_port_12" points="378.4006595218467,191.1953833470734 369.1673536685903,191.1953833470734 369.1673536685903,228.128606760099 378.4006595218467,228.128606760099" fill="none" stroke="#dc2626" stroke-width="1px"/></g><g><polyline data-points="-4.765,3.810000000000001 -4.765,4.010000000000002 -2.7249999999999996,4.010000000000002 -2.7249999999999996,3.81" data-type="line" data-label="schematic_port_19-schematic_port_0" points="40,211.0469909315746 40,192.58037922506173 228.35943940643037,192.58037922506173 228.35943940643037,211.04699093157467" fill="none" stroke="#15803d" stroke-width="1px"/></g><g><polyline data-points="-4.31,5.535 -4.765,5.535 -4.765,3.810000000000001" data-type="line" data-label="schematic_port_2-schematic_port_19" points="82.01154163231661,51.77246496290195 40,51.77246496290195 40,211.0469909315746" fill="none" stroke="#15803d" stroke-width="1px"/></g><g><polyline data-points="-1.1,0.32499999999999996 -1.2,0.32499999999999996 -1.2,3.625 -1.0999999999999996,3.625" data-type="line" data-label="schematic_port_26-schematic_port_12" points="378.40065952184665,532.8276999175598 369.1673536685903,532.8276999175598 369.1673536685903,228.128606760099 378.4006595218467,228.128606760099" fill="none" stroke="#15803d" stroke-width="1px"/></g><g><polyline data-points="1.1,1.125 1.3000000000000003,1.125 1.3000000000000003,2.375 -1.2999999999999996,2.375 -1.2999999999999996,3.625 -1.0999999999999996,3.625" data-type="line" data-label="schematic_port_35-schematic_port_12" points="581.5333882934872,458.96125309150875 600,458.96125309150875 600,343.5449299258039 359.9340478153339,343.5449299258039 359.9340478153339,228.128606760099 378.4006595218467,228.128606760099" fill="none" stroke="#15803d" stroke-width="1px"/></g><g><rect data-type="rect" data-label="schematic_component_5" data-x="-0.09999999999999964" data-y="3.825" x="378.4006595218467" y="181.96207749381708" width="184.66611706512776" height="55.399835119538295" fill="#fff7ed" stroke="black" stroke-width="0.010830357142857142"/></g><g><rect data-type="rect" data-label="schematic_component_9" data-x="0" data-y="0.625" x="378.4006595218467" y="422.0280296784832" width="203.13272877164053" height="166.19950535861494" fill="#fff7ed" stroke="black" stroke-width="0.010830357142857142"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":92.3330585325639,"c":0,"e":479.96702390766694,"b":0,"d":-92.3330585325639,"f":562.8359439406431};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>