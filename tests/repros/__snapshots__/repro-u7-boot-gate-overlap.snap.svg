<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-2.545,-2.3599999999999994 -2.545,-2.5599999999999996 -1.7725,-2.5599999999999996 -1.7725,-2.2000000000000006 -1,-2.2000000000000006" data-type="line" data-label="R1 to U7 pin 25" points="227.0539419087138,497.7593360995848 227.0539419087138,544.232365145228 406.5560165975104,544.232365145228 406.5560165975104,460.5809128630705 586.058091286307,460.5809128630705" fill="none" stroke="#2563eb" stroke-width="13.941908713692943"/></g><g><polyline data-points="-2.32,-0.55 -2.32,-0.75 -1.7725,-0.75 -1.7725,-1.1999999999999997 -2.181,-1.1999999999999997 -2.181,-1.6 -1.7725,-1.6 -1.7725,-0.8 -2.981,-0.8 -2.981,-2.8000000000000007 -1.7725,-2.8000000000000007 -1.7725,-2.2000000000000006" data-type="line" data-label="Q1 to R1 recovery route" points="279.33609958506236,77.17842323651448 279.33609958506236,123.6514522821576 406.5560165975104,123.6514522821576 406.5560165975104,228.21576763485461 311.63485477178426,228.21576763485461 311.63485477178426,321.161825726141 406.5560165975104,321.161825726141 406.5560165975104,135.2697095435684 125.74273858921174,135.2697095435684 125.74273858921174,600 406.5560165975104,600 406.5560165975104,460.5809128630705" fill="none" stroke="#dc2626" stroke-width="13.941908713692943"/></g><g><polyline data-points="-1.7725,-2.5599999999999996 -1.7725,-2.2000000000000006" data-type="line" data-label="overlapping segment" points="406.5560165975104,544.232365145228 406.5560165975104,460.5809128630705" fill="none" stroke="#f59e0b" stroke-width="27.883817427385885"/></g><text data-type="text" data-label="Q1 → R1 reroute" data-x="-2.75" data-y="-0.45" x="179.41908713692953" y="53.9419087136929" fill="#dc2626" font-size="27.883817427385885" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Q1 → R1 reroute</text><text data-type="text" data-label="R1 → U7" data-x="-1.55" data-y="-2.05" x="458.2572614107884" y="425.726141078838" fill="#2563eb" font-size="27.883817427385885" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">R1 → U7</text><text data-type="text" data-label="overlap" data-x="-1.62" data-y="-2.4" x="441.99170124481327" y="507.0539419087135" fill="#d97706" font-size="27.883817427385885" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">overlap</text><g><circle data-type="point" data-label="R1 pin 1" data-x="-2.545" data-y="-2.3599999999999994" cx="227.0539419087138" cy="497.7593360995848" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="U7 pin 25" data-x="-1" data-y="-2.2000000000000006" cx="586.058091286307" cy="460.5809128630705" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="Q1 pin 2" data-x="-2.32" data-y="-0.55" cx="279.33609958506236" cy="77.17842323651448" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="duplicate BOOT_GATE path" data-x="-1.7725" data-y="-2.38" cx="406.5560165975104" cy="502.4066390041492" r="3" fill="#f59e0b"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":232.3651452282157,"c":0,"e":818.4232365145227,"b":0,"d":-232.3651452282157,"f":-50.62240663900417};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>