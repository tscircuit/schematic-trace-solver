<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-2.3000000000000007,3.175 -2.3000000000000007,2.81 -2.500000000000001,2.81 -2.500000000000001,2.51 -2.600000000000001,2.51 -2.600000000000001,2.045" data-type="line" data-label="" points="431.23844731977806,141.996303142329 431.23844731977806,309.31608133086866 339.5563770794822,309.31608133086866 339.5563770794822,446.8391866913123 293.7153419593344,446.8391866913123 293.7153419593344,659.9999999999999" fill="none" stroke="green" stroke-width="6.87615526802218"/></g><g><polyline data-points="-2.770000000000001,2.29 -2.650000000000001,2.29 -2.650000000000001,2.9299999999999997 -2.770000000000001,2.9299999999999997 -2.770000000000001,2.29" data-type="line" data-label="" points="215.785582255083,547.6894639556376 270.7948243992605,547.6894639556376 270.7948243992605,254.30683918669138 215.785582255083,254.30683918669138 215.785582255083,547.6894639556376" fill="none" stroke="#2563eb" stroke-width="3.6672828096118297" stroke-dasharray="4 3"/></g><g><polyline data-points="-1.7000000000000004,3.175 -1.7000000000000004,2.71 -1.8000000000000003,2.71 -1.8000000000000003,2.4099999999999997 -2.0000000000000004,2.4099999999999997 -2.0000000000000004,2.045" data-type="line" data-label="" points="706.2846580406655,141.996303142329 706.2846580406655,355.15711645101646 660.4436229205177,355.15711645101646 660.4436229205177,492.68022181146034 568.7615526802218,492.68022181146034 568.7615526802218,659.9999999999999" fill="none" stroke="green" stroke-width="6.87615526802218"/></g><g><polyline data-points="-1.6500000000000004,2.29 -1.5300000000000002,2.29 -1.5300000000000002,2.9299999999999997 -1.6500000000000004,2.9299999999999997 -1.6500000000000004,2.29" data-type="line" data-label="" points="729.2051756007394,547.6894639556376 784.2144177449169,547.6894639556376 784.2144177449169,254.30683918669138 729.2051756007394,254.30683918669138 729.2051756007394,547.6894639556376" fill="none" stroke="#2563eb" stroke-width="3.6672828096118297" stroke-dasharray="4 3"/></g><circle data-type="circle" data-label="" data-x="-2.600000000000001" data-y="2.61" cx="293.7153419593344" cy="400.9981515711645" r="6.87615526802218" fill="#2563eb" stroke="black" stroke-width="0.002181451612903226"/><circle data-type="circle" data-label="" data-x="-1.7000000000000004" data-y="2.61" cx="706.2846580406655" cy="400.9981515711645" r="6.87615526802218" fill="#2563eb" stroke="black" stroke-width="0.002181451612903226"/><text data-type="text" data-label="OUT_A_P" data-x="-2.710000000000001" data-y="2.61" x="243.29020332717187" y="400.9981515711645" fill="black" font-size="55.00924214417744" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" transform="rotate(-90, 243.29020332717187, 400.9981515711645)">OUT_A_P</text><text data-type="text" data-label="OUT_B_P" data-x="-1.5900000000000003" data-y="2.61" x="756.7097966728281" y="400.9981515711645" fill="black" font-size="55.00924214417744" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" transform="rotate(-90, 756.7097966728281, 400.9981515711645)">OUT_B_P</text><text data-type="text" data-label="Dashed: text bounds / Blue dot: attachment point" data-x="-2.1500000000000004" data-y="3.375" x="500.0000000000001" y="50.314232902033154" fill="#2563eb" font-size="20.62846580406654" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Dashed: text bounds / Blue dot: attachment point</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":458.4103512014787,"c":0,"e":1485.5822550831795,"b":0,"d":-458.4103512014787,"f":1597.4491682070238};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>